name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC
  workflow_dispatch:
    inputs:
      fuzz-time:
        description: Duration per fuzz target
        default: "60s"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Run fuzz targets
        run: make fuzz
        env:
          FUZZ_TIME: ${{ inputs.fuzz-time || (github.event_name == 'schedule' && '5m') || '30s' }}
